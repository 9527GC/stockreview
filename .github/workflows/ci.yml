name: CI

on:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/backend/package-lock.json
      - working-directory: apps/backend
        run: npm ci
      - working-directory: apps/backend
        run: npm audit
      - working-directory: apps/backend
        run: npm run lint
      - working-directory: apps/backend
        run: npm test
        env:
          TEST_MONGODB_URI: mongodb://localhost:27017/stock_review_test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - working-directory: apps/frontend
        run: npm ci
      - working-directory: apps/frontend
        run: npm run test
      - working-directory: apps/frontend
        run: npm run build:h5
